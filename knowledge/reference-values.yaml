# Reference VO2max values for the dashboard's comparison section.
# Curated by Claude from published sources; the dashboard script renders these
# verbatim and never invents numbers. All values are ml/kg/min. Approximate
# literature figures — ranges are honest, precision is not claimed.
#
# Sources: FRIEND registry percentiles (Kaminsky et al., Mayo Clin Proc —
# treadmill-based, so cycling comparisons run slightly conservative);
# rowing & cycling elite values from sport-physiology literature (grade B/C,
# see knowledge/evidence.md framing on practitioner-consensus numbers).
#
# Audit annotations (2026-10; values unchanged — see knowledge/sources.yaml):
# - percentiles: the FRIEND registry papers exist (kaminsky-2015 and later),
#   but these numbers were not checked against them [unverified]. That
#   treadmill norms make cycling comparisons "slightly conservative" is
#   itself unsourced [unverified].
# - athletes: no paper is named for the rower or cyclist figures
#   [unverified].
# - estimate: the ACSM leg-cycling equation is named but not checked
#   (acsm-nd); the FTP = 0.95 x P20 and pVO2max = P20 / 0.85 ratios have no
#   source in the repo [unverified].
# - hr_ratio_estimate: the 15.3 factor matches the Uth 2004 abstract
#   (uth-2004, claim_checked), derived in well-trained men.

percentiles:  # by sex, age decade: [50th, 90th]  ("average" and "top 10%")
  male:
    20-29: [48, 59]
    30-39: [44, 56]
    40-49: [41, 52]
    50-59: [36, 46]
    60-69: [31, 40]
  female:
    20-29: [38, 49]
    30-39: [34, 45]
    40-49: [31, 41]
    50-59: [27, 35]
    60-69: [24, 30]

athletes:  # [unverified] — no source named for these figures
  - label: "Collegiate rower"
    vo2max: 65
    note: "men's heavyweight typically ~62-70; lightweight/women ~55-65"
  - label: "Elite pro cyclist"
    vo2max: 78
    note: "WorldTour typically ~70-85"

# VO2max estimation from the BikeErg 20-min test (documented so the number is
# reproducible): 20-min power ~= FTP / 0.95, power at VO2max ~= P20 / 0.85,
# then ACSM leg-cycling VO2 = 10.8 x W / kg + 7. Grade C estimate; a
# sub-maximal test biases it LOW (see method_caveats.power_estimate).
estimate:
  p20_to_pvo2max_divisor: 0.85   # [unverified] engineering assumption, no source in the repo
  acsm_slope: 10.8               # ACSM leg-cycling equation (acsm-nd; not checked)
  acsm_intercept: 7

# General caveats per estimation method, shown verbatim beside each of the
# athlete's VO2max estimates on the dashboard. Method-level only: what an
# estimate means for one athlete (e.g. which limiter dominates) is recorded in
# that athlete's benchmarks.md, never here. Unsourced claims are [unverified].
method_caveats:
  power_estimate: >-
    estimated from erg power with the ACSM leg-cycling equation and fixed
    power ratios (grade C); an effort short of truly maximal reads low, and
    the error for an individual can be large [unverified]
  hr_ratio_estimate: >-
    Uth–Sørensen heart-rate ratio (15.3 × HRmax ÷ resting HR); depends on an
    accurately measured HRmax and resting HR, and the error for an individual
    can be large [unverified]
  watch_estimate: >-
    consumer wearable estimate modelled by the device maker from HR and
    movement during recorded activities; the method is proprietary and its
    error for an individual can be large [unverified]

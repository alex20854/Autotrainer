# Athlete configuration — the machine-readable contract for zones and matching.
# Updated by /coach setup and after benchmark retests (benchmarks.md is the
# dated human-readable log these values come from). Scripts read this file;
# they never write it.

athlete:
  # Filled in by /coach setup. Formula-derived values are BOOTSTRAP ONLY and
  # must be flagged as such until a field test replaces them (spec §11).
  hr_max: null              # bpm; from observed max or field test, not 220-age
  hr_resting: null          # bpm
  # For the dashboard comparison section + VO2max estimate (mild
  # quasi-identifiers if your workspace repo is public; leave null to omit):
  age: null
  sex: null
  weight_kg: null
  lthr: null                # bpm; lactate threshold HR from a field test
  maf_cap: null             # bpm; 180-age adjusted, if MAF-style base is used
  timezone: "America/New_York"   # home zone, informational (day boundaries in reports); matching compares absolute instants and never reads it

# Zone model: 5 HR zones as % of LTHR (Friel-style). When lthr is null the
# scripts approximate LTHR as 90% of hr_max, apply the same bands, and mark
# computed metrics with zones_source: bootstrap.
zones:
  model: pct_lthr
  # [low, high] as fraction of LTHR. Upper bound exclusive; each zone runs up
  # to the next zone's start (compute_metrics closes integer-percent gaps
  # like 0.89 -> 0.90 itself, and warns on overlaps or wider gaps).
  bands:
    z1: [0.00, 0.85]
    z2: [0.85, 0.90]
    z3: [0.90, 0.95]
    z4: [0.95, 1.00]
    z5: [1.00, 9.99]

# Derived-metric settings (compute_metrics.py). All optional; the values shown
# are the engine defaults — engineering defaults, not a cited standard.
# Decoupling is measured from the end of the warm-up to the end of the session,
# split in half, only for steady-capable modalities; shorter windows report
# null with decoupling_note: window_too_short, and interval sessions (work
# bouts in the watts trace) null with decoupling_note: not_steady.
metrics:
  decoupling_warmup_s: 600        # skipped: HR is still settling here
  decoupling_min_window_s: 1200   # 20 min after the warm-up = 30+ min sessions
  # decoupling_modalities: [...]  # default: every modality except walk,
  #                               # treadmill-walk, sled, mixed

# Per-modality power anchors (watts). ftp drives threshold/sweet-spot targets;
# z2_watts_ceiling cross-checks that "easy" sessions were actually easy.
power:
  bikeerg:  {ftp: null, z2_watts_ceiling: null}
  rowerg:   {ftp: null, z2_watts_ceiling: null}
  skierg:   {ftp: null, z2_watts_ceiling: null}

# Equipment the athlete actually uses; /coach plan should not prescribe
# machines that aren't listed here.
equipment: []     # e.g. concept2-rowerg, concept2-bikeerg, airdyne, treadmill, elliptical (ids from knowledge/machines.md)

# Activity classification: training sessions vs baseline activity.
# Baseline-type records (Apple Watch auto-detected walks etc.) go to the
# weekly rollup (data/baseline.jsonl) instead of the session ledger, UNLESS
# marked deliberate: duration >= promote_min_duration_s, or a monitor photo
# pairs with them. Nothing is discarded — the rollup counts everything routed
# away from sessions. /coach review tunes these values like the modality_map.
classification:
  baseline_types:
    - Walking
    - Outdoor Walk
    - Indoor Walk
    - Hiking
    - HKWorkoutActivityTypeWalking
    - HKWorkoutActivityTypeHiking
  promote_min_duration_s: 1800
  # Records shorter than this can never be verified as sessions (spec §5) —
  # false starts and probes are set aside automatically, reported by ingest.
  min_session_s: 120

# Apple Photos monitor-photo finder (find_monitor_photos.py). All optional —
# engine defaults apply; add consoles the OCR vocabulary doesn't know yet.
photo_finder:
  album: Autotrainer        # photos in this album are always staged
  library: null             # path to the .photoslibrary, only if Photos' own can't be found
  export_timeout_s: 180     # per iCloud-only original fetched through Photos
  extra_brands: []          # e.g. [Keiser]
  extra_terms: []

# Status facts (scripts/status.py) — all optional; engine defaults shown.
# These only set what the facts are measured against; status.py never judges.
# status:
#   unstructured_modalities: [walk, treadmill-walk]  # engineering default: not counted as structured sessions
#   consistency_sessions: 3        # structured sessions per ISO week; practitioner heuristic [unverified] after spec §9's minimum viable week
#   benchmark_cadence_days: 42     # engineering default from benchmarks.md's "re-test every 4-6 weeks"
#   resting_hr_elevated_bpm: 5     # resting HR this far above its 28-day median counts toward days_elevated; practitioner heuristic [unverified]

# Reconciliation settings (spec §7).
matching:
  photo_window_after_end_s: 600     # EXIF must fall in [start, end + 10 min]
  duration_tolerance_s: 90          # |monitor - Health| cross-check
  # Records /coach review deliberately keeps OUT of the session ledger
  # (benchmark probes, accidental recordings). Still in derived records and
  # citable from benchmarks.md; just never proposed as sessions again.
  ignore_records: []
  # Learned mapping: monitor/console machine -> plausible Apple Health workout
  # types. Lookup failures LOWER confidence, never hard-fail (spec §7).
  # /coach review appends new pairings here as they are learned.
  # Three spellings per machine: HealthKit identifiers (export.xml backfill), the
  # display names Health Auto Export / the phone pull use ("Indoor Cycling"), and
  # the c2-* types parse_c2 gives Concept2 logbook rows.
  modality_map:
    concept2-rowerg:   [HKWorkoutActivityTypeRowing, HKWorkoutActivityTypeOther, c2-rowerg, c2-rower]
    concept2-skierg:   [HKWorkoutActivityTypeRowing, HKWorkoutActivityTypeCrossTraining, HKWorkoutActivityTypeOther, c2-skierg]
    concept2-bikeerg:  [HKWorkoutActivityTypeCycling, HKWorkoutActivityTypeOther, Indoor Cycling, Cycling, Other, c2-bikeerg]
    airdyne:           [HKWorkoutActivityTypeCycling, HKWorkoutActivityTypeCrossTraining, HKWorkoutActivityTypeOther, Elliptical, Indoor Cycling, Cycling, Cross Training, Other]
    stairclimber:      [HKWorkoutActivityTypeStairClimbing, HKWorkoutActivityTypeStairs, HKWorkoutActivityTypeOther, Stair Climbing, Stairs, Other]
    versaclimber:      [HKWorkoutActivityTypeClimbing, HKWorkoutActivityTypeCrossTraining, HKWorkoutActivityTypeOther]
    exercise-bike:     [HKWorkoutActivityTypeCycling, Indoor Cycling, Cycling]
    treadmill:         [HKWorkoutActivityTypeRunning, HKWorkoutActivityTypeWalking]
    elliptical:        [HKWorkoutActivityTypeElliptical, HKWorkoutActivityTypeCrossTraining, HKWorkoutActivityTypeOther, Elliptical, Cross Training, Other]

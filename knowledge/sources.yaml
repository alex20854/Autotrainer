# Sources ledger — one entry per citation that appears in knowledge/ or
# cardio-coach-spec.md, plus the manufacturer pages read to write the
# Concept2 console entries in machines.md.
#
# It separates two questions the knowledge base used to blur:
#   exists         — does the cited work exist? null = not checked;
#                    true = found (identifier recorded); false = looked for
#                    and could not be found.
#   claim_checked  — does the work say what the repo attributes to it?
#                    true ONLY when a fetched abstract, paper or page states
#                    the specific claim; `note` says what was read. A
#                    resolving DOI proves existence, never the claim.
#
# Rules:
# - claim_checked: true requires exists: true (tests/test_knowledge.py).
# - Never import new claims from a source into the knowledge base without
#   recording them here; the coach cites a claim_checked: false source as
#   unverified and never as grade A (skills/coach/SKILL.md, Voice).
# - claim_checked: true covers only the figures the entry's `note` names as
#   read; a figure quoted after "Not checked:" in a note must carry an
#   [unverified] tag wherever it appears in knowledge/ (tests/test_knowledge.py).
# - id is author-year (lowercase, hyphenated); `-nd` = no year given in the
#   repo. Style frontmatter `key_source_ids` must resolve to an id here.
# - cited_in paths are relative to the engine root; `#` names the section.
#
# Checked on 2026-10-03 via PubMed E-utilities (esearch/esummary/efetch
# abstracts) and the publishers' or manufacturers' own pages.

